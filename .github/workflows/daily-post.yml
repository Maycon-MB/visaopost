name: Daily demo post

# Gera 1 post/dia pro tenant demo, commita JPEG + metadata.json em previews/.
# Atualiza previews/index.html (galeria estática). GH Pages serve /previews.
# Substituido por RQ + Redis no VPS na Fase 8.
#
# Requer secret GEMINI_API_KEY no repositorio (Settings → Secrets → Actions).
# Falha = nao quebra branch main; job marca FAILED no Actions tab.

on:
  schedule:
    # 09:00 UTC = 06:00 BRT. Cron GH Actions roda em UTC.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Data alvo (YYYY-MM-DD). Vazio = hoje."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate:
    name: Generate demo post
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: visaopost
          POSTGRES_PASSWORD: visaopost_dev
          POSTGRES_DB: visaopost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visaopost -d visaopost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://visaopost:visaopost_dev@localhost:5432/visaopost
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      APP_ENV: ci
      LOG_LEVEL: INFO
      TENANT_SLUG: dilorenzo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium for Playwright
        working-directory: backend
        run: python -m playwright install --with-deps chromium

      - name: Apply migrations + seed
        working-directory: backend
        env:
          PGPASSWORD: visaopost_dev
        run: |
          for f in app/db/migrations/*.sql; do
            echo "== Applying $f =="
            psql -h localhost -U visaopost -d visaopost -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Resolve target date
        id: target
        run: |
          INPUT="${{ github.event.inputs.target_date }}"
          if [ -z "$INPUT" ]; then
            INPUT=$(date -u +%Y-%m-%d)
          fi
          echo "date=$INPUT" >> "$GITHUB_OUTPUT"
          echo "Target date: $INPUT"

      - name: Generate demo post
        working-directory: backend
        run: python -m scripts.generate_demo_post ${{ steps.target.outputs.date }}

      - name: Rebuild gallery index
        working-directory: backend
        run: python -m scripts.build_previews_index

      - name: Commit previews
        env:
          DATE: ${{ steps.target.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(previews): demo post $DATE [skip ci]"
          git push
