events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 256;
    gzip_vary on;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # SSL params reutilizados
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MozSSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # ─── HTTP: redirect tudo + certbot challenge ───────────────────────────
    server {
        listen 80;
        server_name visaopost.com.br www.visaopost.com.br api.visaopost.com.br app.visaopost.com.br;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── HTTPS: API (FastAPI) ──────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.visaopost.com.br;

        ssl_certificate     /etc/letsencrypt/live/visaopost.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/visaopost.com.br/privkey.pem;

        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;

        client_max_body_size 20m;

        location / {
            proxy_pass         http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }

    # ─── HTTPS: PWA admin (app.visaopost.com.br) ──────────────────────────
    server {
        listen 443 ssl http2;
        server_name app.visaopost.com.br;

        ssl_certificate     /etc/letsencrypt/live/visaopost.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/visaopost.com.br/privkey.pem;

        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options nosniff;

        root  /var/www/app;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|woff2|woff|ttf|svg|ico|png|jpg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ─── HTTPS: Landing (visaopost.com.br) ────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name visaopost.com.br www.visaopost.com.br;

        ssl_certificate     /etc/letsencrypt/live/visaopost.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/visaopost.com.br/privkey.pem;

        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options nosniff;

        # www → apex
        if ($host = www.visaopost.com.br) {
            return 301 https://visaopost.com.br$request_uri;
        }

        root  /var/www/landing;
        index index.html;

        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        location ~* \.(js|css|woff2|woff|ttf|svg|ico|png|jpg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
