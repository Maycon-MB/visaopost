el-line w-full" data-astro-cid-tvv6smhg></div> <div class="skel-line w-5/6" data-astro-cid-tvv6smhg></div> <div class="skel-line w-2/3" data-astro-cid-tvv6smhg></div> </div> </div><div class="skeleton-card" data-astro-cid-tvv6smhg> <div class="skel-img" data-astro-cid-tvv6smhg></div> <div class="skel-info" data-astro-cid-tvv6smhg> <div class="skel-line w-1/3" style="margin-bottom:0.8rem" data-astro-cid-tvv6smhg></div> <div class="skel-line w-full" data-astro-cid-tvv6smhg></div> <div class="skel-line w-5/6" data-astro-cid-tvv6smhg></div> <div class="skel-line w-2/3" data-astro-cid-tvv6smhg></div> </div> </div><div class="skeleton-card" data-astro-cid-tvv6smhg> <div class="skel-img" data-astro-cid-tvv6smhg></div> <div class="skel-info" data-astro-cid-tvv6smhg> <div class="skel-line w-1/3" style="margin-bottom:0.8rem" data-astro-cid-tvv6smhg></div> <div class="skel-line w-full" data-astro-cid-tvv6smhg></div> <div class="skel-line w-5/6" data-astro-cid-tvv6smhg></div> <div class="skel-line w-2/3" data-astro-cid-tvv6smhg></div> </div> </div> </div> </main> <footer class="footer" data-astro-cid-tvv6smhg> <p data-astro-cid-tvv6smhg>© 2026 Ótica Di Lorenzo &nbsp;·&nbsp; <a href="/visaopost/dilorenzo/" data-astro-cid-tvv6smhg>Página inicial</a> &nbsp;·&nbsp; <a href="https://instagram.com/oticadilorenzo" target="_blank" rel="noopener" data-astro-cid-tvv6smhg>@oticadilorenzo</a></p> </footer> <script>(function(){const API_URL = "http://localhost:8000";

    const grid = document.getElementById('gallery-grid');

    const MONTH_PT = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

    function fmtDate(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return '';
      return `${String(d.getUTCDate()).padStart(2,'0')} ${MONTH_PT[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
    }

    function statusLabel(s) {
      return s === 'posted' ? 'Publicado' : 'Aprovado';
    }

    function renderCard(post, index) {
      const delay = `${(index * 0.07).toFixed(2)}s`;
      const imgSrc = `${API_URL}${post.image_url}`;
      const tags = (post.hashtags ?? []).slice(0, 6);

      const article = document.createElement('article');
      article.className = 'post-card';
      article.style.setProperty('--delay', delay);

      article.innerHTML = `
        <div class="post-img-wrap">
          <img src="${imgSrc}" alt="Post Di Lorenzo — ${post.theme ?? ''}" loading="lazy" />
          <span class="post-status-badge ${post.status === 'posted' ? 'badge-posted' : 'badge-approved'}">
            ${statusLabel(post.status)}
          </span>
        </div>
        <div class="post-info">
          <time class="post-date">${fmtDate(post.scheduled_at)}</time>
          <p class="post-caption">${post.caption ?? ''}</p>
          ${tags.length ? `
          <div class="post-tags">
            ${tags.map(t => `<span class="post-tag">#${t}</span>`).join('')}
          </div>` : ''}
        </div>
      `;

      return article;
    }

    function renderEmpty() {
      grid.innerHTML = `
        <div class="empty-state">
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <p class="empty-title">Em breve, novidades aqui.</p>
          <p class="empty-sub">Os posts aprovados aparecerão nesta galeria.</p>
        </div>
      `;
    }

    function renderError() {
      grid.innerHTML = `
        <div class="error-banner" style="display:block">
          Não foi possível carregar o feed. Tente novamente em instantes.
        </div>
      `;
    }

    async function loadGallery() {
      try {
        const res = await fetch(`${API_URL}/public/dilorenzo/gallery?limit=30`, {
          headers: { 'Accept': 'application/json' }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const posts = await res.json();

        if (!posts.length) {
          renderEmpty();
          return;
        }

        grid.innerHTML = '';
        posts.forEach((post, i) => grid.appendChild(renderCard(post, i)));
      } catch (err) {
        console.error('[gallery] fetch failed:', err);
        renderError();
      }
    }

    loadGallery();
  })();</script> </body> </html>
