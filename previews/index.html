<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VisaoPost — Galeria de previews</title>
<style>
  :root {
    --bg: #0e0e10;
    --card: #17171b;
    --fg: #f4f4f5;
    --muted: #a1a1aa;
    --accent: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.5;
  }
  header {
    padding: 32px 20px 16px;
    text-align: center;
    border-bottom: 1px solid #27272a;
  }
  header h1 { margin: 0 0 4px; font-size: 28px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 16px 64px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid #27272a;
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card img { width: 100%; height: auto; display: block; aspect-ratio: 1/1; object-fit: cover; }
  .meta { padding: 14px 16px 18px; }
  .meta h2 { margin: 0 0 8px; font-size: 18px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .badge {
    background: #27272a;
    color: var(--muted);
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .caption {
    margin: 8px 0;
    font-size: 14px;
    color: #d4d4d8;
    white-space: pre-wrap;
    max-height: 9em;
    overflow: hidden;
  }
  .cta { margin: 6px 0 0; color: var(--accent); font-size: 13px; font-weight: 600; }
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--muted);
    padding: 64px 16px;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 16px;
    border-top: 1px solid #27272a;
  }
</style>
</head>
<body>
<header>
  <h1>VisaoPost — Galeria de previews</h1>
  <p>0 post(s) gerado(s). Atualizado em 2026-05-28 13:54 UTC.</p>
</header>
<main>
<p class="empty">Nenhum preview ainda. O cron diário irá gerar o primeiro post.</p>
</main>
<footer>Cron diário GH Actions. Demo pré-produção — não publicado no Instagram.</footer>
</body>
</html>
